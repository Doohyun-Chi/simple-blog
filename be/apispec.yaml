openapi: 3.1.0
info:
  title: simple-blog API
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local
paths:
  /actuator/health:
    get:
      summary: Application health
      operationId: getHealth
      tags:
        - Operations
      responses:
        '200':
          description: Application is healthy
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Application is unhealthy
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
  /actuator/health/liveness:
    get:
      summary: Liveness probe
      description: >
        Reports whether the process is alive. Does not depend on the database,
        so use this (not /actuator/health) for restart decisions.
      operationId: liveness
      tags:
        - Operations
      responses:
        '200':
          description: Application is alive
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Application is broken and should be restarted
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
  /actuator/health/readiness:
    get:
      summary: Readiness probe
      description: >
        Reports whether the application can accept traffic. Includes the database.
      operationId: readiness
      tags:
        - Operations
      responses:
        '200':
          description: Application is ready to accept traffic
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Application is not ready (for example, the database is unreachable)
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
  /public/api/v1/pages:
    get:
      summary: List all published pages
      description: >
        Returns every published page, ordered by menuOrder and then id.
        Page content is not included.
      operationId: listOfPages
      tags:
        - Pages
      responses:
        '200':
          description: Published pages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageList'
              example:
                pages:
                  - id: 2
                    title: 개발자의 꿈
                    slug: about
                    parentId: null
                    menuOrder: 0
                    publishedAt: '2016-03-14T02:36:24Z'
                    modifiedAt: '2024-03-01T23:57:29Z'
                  - id: 646
                    title: 글읽기( ~ 2019)
                    slug: reading-in-2019
                    parentId: 383
                    menuOrder: 0
                    publishedAt: '2019-02-07T00:41:58Z'
                    modifiedAt: '2020-04-16T15:27:54Z'
  /public/api/v1/post/{slug}:
    get:
      summary: Read a body of a post or a page.
      description: >
        Returns the wp_posts row whose slug matches, whatever its type, status or password. For unknown slugs, it responds with 404.
      operationId: postBody
      tags:
        - Posts
      parameters:
        - name: slug
          in: path
          required: true
          description: >
            The post's slug as readers see it, URL-encoded once like any path segment (e.g. 큰기업 is sent as
            %ED%81%B0...). WordPress stores non-ASCII slugs in wp_posts.post_name already percent-encoded in
            lowercase; the server converts to that form before matching, so clients never send the stored form.
          schema:
            type: string
          example: kpi-power-in-big-company
      responses:
        '200':
          description: The post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostBody'
              example:
                title: 큰기업의 배움 - KPI, 조직을 움직이는 힘
                content: '<!-- wp:paragraph --><p>...</p><!-- /wp:paragraph -->'
                status: publish
                date: '2026-11-05T09:45:11'
                modified: '2026-11-05T09:45:11'
        '404':
          description: No row in wp_posts has this slug. The response body is not part of the contract.
components:
  schemas:
    PostBody:
      type: object
      required:
        - title
        - content
        - status
        - date
        - modified
      properties:
        title:
          type: string
          description: wp_posts.post_title
        content:
          type: string
          description: >
            wp_posts.post_content as stored, including WordPress block comments and shortcodes.
            It is not rendered HTML.
        status:
          type: string
          description: wp_posts.post_status as stored (e.g. publish, draft, private); rows of any status are returned
          examples:
            - publish
        date:
          type: string
          description: >
            wp_posts.post_date, the publish time in the site's local time zone (Asia/Seoul),
            formatted as yyyy-MM-ddTHH:mm:ss with no offset
          examples:
            - '2026-11-05T09:45:11'
        modified:
          type: string
          description: wp_posts.post_modified, the last modified time in the same local format as date
          examples:
            - '2026-11-05T09:45:11'
    PageList:
      type: object
      required:
        - pages
      properties:
        pages:
          type: array
          items:
            $ref: '#/components/schemas/PageSummary'
    PageSummary:
      type: object
      required:
        - id
        - title
        - slug
        - parentId
        - menuOrder
        - publishedAt
        - modifiedAt
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        slug:
          type: string
          description: URL-friendly page name
        parentId:
          type:
            - integer
            - 'null'
          format: int64
          description: Parent page id, or null for a top-level page
        menuOrder:
          type: integer
        publishedAt:
          type: string
          format: date-time
          description: Publish time in UTC
        modifiedAt:
          type: string
          format: date-time
          description: Last modified time in UTC
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          examples:
            - UP
