openapi: 3.1.0
info:
  title: simple-blog API
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local
paths:
  /actuator/health:
    get:
      summary: Application health
      operationId: getHealth
      tags:
        - Operations
      responses:
        '200':
          description: Application is healthy
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Application is unhealthy
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
  /actuator/health/liveness:
    get:
      summary: Liveness probe
      description: >
        Reports whether the process is alive. Does not depend on the database,
        so use this (not /actuator/health) for restart decisions.
      operationId: liveness
      tags:
        - Operations
      responses:
        '200':
          description: Application is alive
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Application is broken and should be restarted
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
  /actuator/health/readiness:
    get:
      summary: Readiness probe
      description: >
        Reports whether the application can accept traffic. Includes the database.
      operationId: readiness
      tags:
        - Operations
      responses:
        '200':
          description: Application is ready to accept traffic
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Application is not ready (for example, the database is unreachable)
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
  /public/auth/google:
    get:
      summary: Start the Google sign-in
      description: >
        For browsers, not for API clients: navigate here (a plain link) to sign in with a Google account. The server
        redirects to Google with the OpenID Connect authorization request (scope openid, profile and email, plus state
        and nonce). Not available (404) when the server has no Google client configured.
      operationId: startGoogleLogin
      tags:
        - Authentication
      responses:
        '302':
          description: Redirect to the Google authorization endpoint
          headers:
            Location:
              schema:
                type: string
        '404':
          description: Google sign-in is not configured on this server. The response body is not part of the contract.
  /public/auth/google/callback:
    get:
      summary: Finish the Google sign-in
      description: >
        The redirect URI registered for the Google OAuth client; only Google's redirect should reach it. The server
        checks state, exchanges the code for tokens with its client secret and validates the ID token. On success it
        starts a session (cookie JSESSIONID) and redirects to the frontend's home page. Only Google accounts whose
        verified email is on the server's list of allowed users may sign in; any other account is turned away with the
        query login=unauthorized. On any other failure, including the user declining, it redirects to the frontend's
        home page with the query login=failed. Neither starts a session. The client secret never leaves the server.
      operationId: finishGoogleLogin
      tags:
        - Authentication
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the frontend, signed in or with login=failed or login=unauthorized
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: The session cookie, only on success
              schema:
                type: string
  /public/api/v1/me:
    get:
      summary: The signed-in user
      description: >
        Identifies who the session cookie belongs to, so the frontend can show the email. The email is the one of the
        verified Google ID token, never a value the client sent. Send the request with credentials (cookies).
      operationId: me
      tags:
        - Authentication
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
              example:
                email: owner@example.com
        '401':
          description: Not signed in. No session is created. The response body is not part of the contract.
  /public/api/v1/pages:
    get:
      summary: List all published pages
      description: >
        Returns every published page, ordered by menuOrder and then id.
        Page content is not included.
      operationId: listOfPages
      tags:
        - Pages
      responses:
        '200':
          description: Published pages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageList'
              example:
                pages:
                  - id: 2
                    title: 개발자의 꿈
                    slug: about
                    parentId: null
                    menuOrder: 0
                    publishedAt: '2016-03-14T02:36:24Z'
                    modifiedAt: '2024-03-01T23:57:29Z'
                  - id: 646
                    title: 글읽기( ~ 2019)
                    slug: reading-in-2019
                    parentId: 383
                    menuOrder: 0
                    publishedAt: '2019-02-07T00:41:58Z'
                    modifiedAt: '2020-04-16T15:27:54Z'
  /public/api/v1/posts:
    get:
      summary: List published posts matching a search query
      description: >
        Returns published posts (post_type 'post', post_status 'publish', no password) that match the query,
        ordered by creation date newest first (wp_posts.post_date descending, then ID descending). Post content
        is not included. Without query, every published post matches, so the call also serves as the recent posts
        list (use limit). The client sends a search when the user presses Enter in the search input, and does not
        send it when the input is blank.
      operationId: listOfPosts
      tags:
        - Posts
      parameters:
        - name: queryType
          in: query
          required: false
          description: >
            How query is matched. keyword: case-insensitive substring match against wp_posts.post_title or
            wp_posts.post_content; a post matches if either contains the query. The content match runs on the
            stored content, so it can also hit block comments and markup.
            tag: reserved; the matching rule is not defined yet and the server responds with 501.
          schema:
            type: string
            enum:
              - keyword
              - tag
            default: keyword
        - name: query
          in: query
          required: false
          description: >
            The search text exactly as the user typed it in the search input. When absent, every published post
            matches. When present it must contain at least one non-whitespace character; an empty or
            whitespace-only query is rejected with 400.
          schema:
            type: string
            minLength: 1
            pattern: '\S'
          example: KPI
        - name: limit
          in: query
          required: false
          description: >
            The maximum number of posts to return, taken from the newest. When absent, every match is returned.
            A value outside 1 to 100, or not an integer, is rejected with 400.
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 10
      responses:
        '200':
          description: Matching published posts; an empty list when nothing matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostList'
              example:
                posts:
                  - id: 7061
                    title: 큰기업의 배움 - KPI, 조직을 움직이는 힘
                    slug: '%ed%81%b0%ea%b8%b0%ec%97%85%ec%9d%98-%eb%b0%b0%ec%9b%80-kpi'
                    date: '2026-11-05T09:45:11'
        '400':
          description: >
            query is present but empty or whitespace-only, queryType is not one of the allowed values, or limit is
            not an integer from 1 to 100. The response body is not part of the contract.
        '501':
          description: queryType is tag, which is not implemented yet. The response body is not part of the contract.
  /public/api/v1/post:
    post:
      summary: Create a post
      description: >
        Creates a post as a draft (wp_posts.post_status 'draft'); status cannot be set by the client. Publishing is
        not part of this contract yet. The created post is returned with its stored values.
      operationId: createPost
      tags:
        - Posts
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostBody'
        '400':
          description: A required field is missing or blank, the title is longer than 130 characters, or the slug is longer than 200 characters or has a character other than English letters and '-'. The response body is not part of the contract.
        '401':
          description: Not authenticated. The response body is not part of the contract.
        '403':
          description: Signed in, but the request has no valid CSRF token (the X-XSRF-TOKEN header must equal the XSRF-TOKEN cookie). The response body is not part of the contract.
        '409':
          description: Another post already has this slug. The response body is not part of the contract.
        '500':
          description: Failed to create. The response body is not part of the contract.
  /public/api/v1/post/{slug}:
    put:
      summary: Update a post
      description: >
        Replaces title, slug and content of the post identified by the path slug and leaves its status unchanged.
        If the body slug differs from the path slug, the post is renamed; the old slug no longer resolves.
      operationId: updatePost
      tags:
        - Posts
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The current slug of the post, encoded as in the GET operation of this path.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostBody'
        '400':
          description: A required field is missing or blank, the title is longer than 130 characters, or the slug is longer than 200 characters or has a character other than English letters and '-'. The response body is not part of the contract.
        '401':
          description: Not authenticated. The response body is not part of the contract.
        '403':
          description: Signed in, but the request has no valid CSRF token (the X-XSRF-TOKEN header must equal the XSRF-TOKEN cookie). The response body is not part of the contract.
        '404':
          description: No row in wp_posts has the path slug. The response body is not part of the contract.
        '409':
          description: Another post already has the body slug. The response body is not part of the contract.
        '500':
          description: Failed to update. The response body is not part of the contract.
    get:
      summary: Read a body of a post or a page.
      description: >
        Returns the wp_posts row whose slug matches, whatever its type, status or password. For unknown slugs, it responds with 404.
      operationId: postBody
      tags:
        - Posts
      parameters:
        - name: slug
          in: path
          required: true
          description: >
            The post's slug as readers see it, URL-encoded once like any path segment (e.g. 큰기업 is sent as
            %ED%81%B0...). WordPress stores non-ASCII slugs in wp_posts.post_name already percent-encoded in
            lowercase; the server converts to that form before matching, so clients never send the stored form.
          schema:
            type: string
          example: kpi-power-in-big-company
      responses:
        '200':
          description: The post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostBody'
              example:
                title: 큰기업의 배움 - KPI, 조직을 움직이는 힘
                slug: '%ed%81%b0%ea%b8%b0%ec%97%85%ec%9d%98-%eb%b0%b0%ec%9b%80-kpi'
                content: '<!-- wp:paragraph --><p>...</p><!-- /wp:paragraph -->'
                status: publish
                date: '2026-11-05T09:45:11'
                modified: '2026-11-05T09:45:11'
        '404':
          description: No row in wp_posts has this slug. The response body is not part of the contract.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  schemas:
    Identity:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          description: The email address of the signed-in Google account
    PostInput:
      type: object
      required:
        - title
        - slug
        - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 130
          pattern: '\S'
          description: wp_posts.post_title; must contain a non-whitespace character, at most 130 characters
        slug:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z-]+$'
          description: |
            User friendly and unique URL, stored at wp_posts.post_name. Only English letters (A-Z, a-z) and '-' are
            allowed: no space, digit, non-ASCII or other character. Anything else is rejected with 400.
        content:
          type: string
          description: wp_posts.post_content
    PostList:
      type: object
      required:
        - posts
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/PostSummary'
    PostSummary:
      type: object
      required:
        - id
        - title
        - slug
        - date
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: wp_posts.post_title
        slug:
          type: string
          description: >
            wp_posts.post_name as stored. Non-ASCII slugs are lowercase percent-encoded, so decode once
            to get the slug readers see before building /post/{slug} or calling /public/api/v1/post/{slug}.
        date:
          type: string
          description: wp_posts.post_date in the same local format as PostBody.date
          examples:
            - '2026-11-05T09:45:11'
    PostBody:
      type: object
      required:
        - title
        - slug
        - content
        - status
        - date
        - modified
      properties:
        title:
          type: string
          description: wp_posts.post_title
        slug:
          type: string
          description: User friendly and unique URL, stored at wp_posts.post_name
        content:
          type: string
          description: >
            wp_posts.post_content as stored, including WordPress block comments and shortcodes.
            It is not rendered HTML.
        status:
          type: string
          description: wp_posts.post_status as stored (e.g. publish, draft, private); rows of any status are returned
          examples:
            - publish
        date:
          type: string
          description: >
            wp_posts.post_date, the publish time in the site's local time zone (Asia/Seoul),
            formatted as yyyy-MM-ddTHH:mm:ss with no offset
          examples:
            - '2026-11-05T09:45:11'
        modified:
          type: string
          description: wp_posts.post_modified, the last modified time in the same local format as date
          examples:
            - '2026-11-05T09:45:11'
    PageList:
      type: object
      required:
        - pages
      properties:
        pages:
          type: array
          items:
            $ref: '#/components/schemas/PageSummary'
    PageSummary:
      type: object
      required:
        - id
        - title
        - slug
        - parentId
        - menuOrder
        - publishedAt
        - modifiedAt
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        slug:
          type: string
          description: URL-friendly page name
        parentId:
          type:
            - integer
            - 'null'
          format: int64
          description: Parent page id, or null for a top-level page
        menuOrder:
          type: integer
        publishedAt:
          type: string
          format: date-time
          description: Publish time in UTC
        modifiedAt:
          type: string
          format: date-time
          description: Last modified time in UTC
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          examples:
            - UP
