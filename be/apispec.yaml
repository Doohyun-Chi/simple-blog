openapi: 3.1.0
info:
  title: simple-blog API
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local
paths:
  /actuator/health:
    get:
      summary: Application health
      operationId: getHealth
      tags:
        - Operations
      responses:
        '200':
          description: Application is healthy
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Application is unhealthy
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
  /actuator/health/liveness:
    get:
      summary: Liveness probe
      description: >
        Reports whether the process is alive. Does not depend on the database,
        so use this (not /actuator/health) for restart decisions.
      operationId: liveness
      tags:
        - Operations
      responses:
        '200':
          description: Application is alive
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Application is broken and should be restarted
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
  /actuator/health/readiness:
    get:
      summary: Readiness probe
      description: >
        Reports whether the application can accept traffic. Includes the database.
      operationId: readiness
      tags:
        - Operations
      responses:
        '200':
          description: Application is ready to accept traffic
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Application is not ready (for example, the database is unreachable)
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
  /public/auth/google:
    get:
      summary: Start the Google sign-in
      description: >
        For browsers, not for API clients: navigate here (a plain link) to sign in with a Google account. The server
        redirects to Google with the OpenID Connect authorization request (scope openid, profile and email, plus state
        and nonce). Not available (404) when the server has no Google client configured.
      operationId: startGoogleLogin
      tags:
        - Authentication
      responses:
        '302':
          description: Redirect to the Google authorization endpoint
          headers:
            Location:
              schema:
                type: string
        '404':
          description: Google sign-in is not configured on this server. The response body is not part of the contract.
  /public/auth/google/callback:
    get:
      summary: Finish the Google sign-in
      description: >
        The redirect URI registered for the Google OAuth client; only Google's redirect should reach it. The server
        checks state, exchanges the code for tokens with its client secret and validates the ID token. On success it
        starts a session (cookie JSESSIONID) and redirects to the frontend's home page. Only Google accounts whose
        verified email is on the server's list of allowed users may sign in; any other account is turned away with the
        query login=unauthorized. On any other failure, including the user declining, it redirects to the frontend's
        home page with the query login=failed. Neither starts a session. The client secret never leaves the server.
      operationId: finishGoogleLogin
      tags:
        - Authentication
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the frontend, signed in or with login=failed or login=unauthorized
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: The session cookie, only on success
              schema:
                type: string
  /public/share/{slug}:
    get:
      summary: Open Graph and Twitter card tags of a post or a page, for sharing its link
      description: >
        For link-preview crawlers (KakaoTalk, Facebook, Slack and the like), which do not run the frontend's scripts:
        share this URL instead of the post view URL. It answers a small HTML page whose head holds the Open Graph tags of
        the post and whose body holds one link to the post view, so a person who lands here can follow it. A script sends
        a browser on to that link at once; crawlers do not run scripts, so they stay and read the tags. There is
        deliberately no `og:url`: crawlers such as LinkedIn and Facebook treat it as the canonical address and read the tags
        from there instead, which for a post view URL is the frontend's page without any, so this share URL is the
        canonical one. Nothing is redirected by the server, because a crawler must be able to read the tags. Only a published row of type post or page has a share
        page; any other row, and an unknown slug, is 404, so a draft or private post never leaks its title or text.
        The values are HTML-escaped (an ellipsis goes out as `&hellip;`, which readers and crawlers decode as `…`).

        - `og:title` is the title.

        - `og:description` is the first 200 characters of the content as plain text (Markdown, HTML tags, WordPress
        block comments and fenced code blocks such as Mermaid diagrams removed, whitespace collapsed), cut before a word so that no word is broken, with `…` appended
        when anything was cut (so at most 201 characters). A text of 200 characters or fewer is used whole, without the
        `…`. A first word longer than 200 characters is cut at 200 and gets the `…`.

        - `og:image` is the first image in the content, Markdown `![alt](src)` or HTML `<img src>`, as an absolute URL: a
        relative source is resolved against this server's origin, and an absolute one, such as an external image of a
        post migrated from WordPress, is used as it is. When the content has no image it is the frontend's
        `/realizing-future.jpg` (for example https://www.chidoo.me/realizing-future.jpg).

        - The link in the body, and where the script goes, is the post view URL with the same slug: the frontend's
        `/post/{slug}` for a post and `/page/{slug}` for a page, the slug as readers see it and URL-encoded once. The
        frontend's origin is the server's `simpleblog.auth.frontend-url`.

        - `twitter:card` is always `summary_large_image`, as there is always an image. X (Twitter) takes the title,
        description and image from the `og:` tags above.
      operationId: shareOfPost
      tags:
        - Share
      parameters:
        - name: slug
          in: path
          required: true
          description: >
            The slug as readers see it, URL-encoded once, exactly as for `GET /public/api/v1/post/{slug}`.
          schema:
            type: string
          example: kpi-power-in-big-company
      responses:
        '200':
          description: The share page
          content:
            text/html:
              schema:
                type: string
              example: |
                <!doctype html>
                <html lang="ko">
                <head>
                <meta charset="utf-8" />
                <title>글 제목</title>
                <meta property="og:title" content="글 제목" />
                <meta property="og:description" content="요약…" />
                <meta property="og:image" content="https://blog.chidoo.me/public/api/v1/media/thumb" />
                <meta name="twitter:card" content="summary_large_image" />
                </head>
                <body>
                <a href="https://www.chidoo.me/post/kpi-power-in-big-company">글 제목</a>
                <script>location.replace(document.querySelector('a').href)</script>
                </body>
                </html>
        '404':
          description: No published post or page has this slug. The response body is not part of the contract.
  /public/feed:
    get:
      summary: Atom feed of the newest published posts
      description: >
        An Atom 1.0 feed (RFC 4287) for feed readers. It lists the 20 newest published posts (type post, status publish;
        pages, drafts and private rows are never listed, whoever asks), ordered like `GET /public/api/v1/posts`: creation date newest
        first, then id descending. The response is `application/atom+xml; charset=utf-8`, and every text value is
        XML-escaped. The server keeps the feed in a local cache that expires 24 hours after it was loaded, and drops it
        as soon as a post is created, updated or deleted, so the next request shows the change.

        Feed level elements:

        - `title` is the blog's name, `Dreaming for the Future`.

        - `id` and the `link rel="alternate"` are the frontend's origin (`simpleblog.auth.frontend-url`) with `/`; the
        `link rel="self"` is this feed's own URL.

        - `updated` is the `updated` of the first entry, or the server's current time when there is no post.

        Each post is one `entry`:

        - `id` and `link rel="alternate"` are the post view URL: the frontend's `/post/{slug}`, the slug as readers see
        it and URL-encoded once. The `id` is that URL so it stays the same as long as the slug does.

        - `title` is the title.

        - `published` is the creation date and `updated` the modification date, both as RFC 3339 times with the
        server's zone offset (for example `2026-11-05T09:45:11+09:00`).

        - There is no `summary` or `content`: an entry carries only the title and the link, so a reader follows the link
        to read the post.

        - `author` has the `name` of the blog's writer, `Dreaming for the Future`, as the posts hold no author name yet.
      operationId: atomFeed
      tags:
        - Feed
      responses:
        '200':
          description: The feed; an Atom document with no `entry` when there is no published post
          content:
            application/atom+xml:
              schema:
                type: string
              example: |
                <?xml version="1.0" encoding="utf-8"?>
                <feed xmlns="http://www.w3.org/2005/Atom">
                  <title>Dreaming for the Future</title>
                  <id>https://www.chidoo.me/</id>
                  <link rel="alternate" href="https://www.chidoo.me/" />
                  <link rel="self" href="https://blog.chidoo.me/public/feed" />
                  <updated>2026-11-05T09:45:11+09:00</updated>
                  <entry>
                    <id>https://www.chidoo.me/post/kpi-power-in-big-company</id>
                    <title>KPI, 조직을 움직이는 힘</title>
                    <link rel="alternate" href="https://www.chidoo.me/post/kpi-power-in-big-company" />
                    <published>2026-11-05T09:45:11+09:00</published>
                    <updated>2026-11-06T10:00:00+09:00</updated>
                    <author><name>Dreaming for the Future</name></author>
                  </entry>
                </feed>
  /public/sitemap.xml:
    get:
      summary: Sitemap of the published posts
      description: >
        A sitemap (https://www.sitemaps.org/protocol.html) for search engines, listing the frontend's home page and every
        published post (type post, status publish; pages, drafts and private rows are never listed, whoever asks), newest
        modification first. The response is `application/xml; charset=utf-8`, and every value is XML-escaped.

        The list is kept in the same local cache as the feed. It expires 24 hours after it was loaded, and is dropped as soon as a post is created, updated or deleted; the next request then reads it from the database again.

        - `loc` is the frontend's origin (`simpleblog.auth.frontend-url`) with `/` for the home page, and with the post view path
        `/post/{slug}` for a post (the slug as readers see it, URL-encoded once).

        - `lastmod` of a post is its modification date as a UTC W3C datetime (for example `2026-11-06T01:00:00Z`); the home page has none.

        `robots.txt` of the frontend points search engines to this URL.
      operationId: sitemap
      tags:
        - SEO
      responses:
        '200':
          description: The sitemap; a `urlset` with only the home page when there is no published post
          content:
            application/xml:
              schema:
                type: string
              example: |
                <?xml version="1.0" encoding="utf-8"?>
                <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
                  <url>
                    <loc>https://www.chidoo.me/</loc>
                  </url>
                  <url>
                    <loc>https://www.chidoo.me/post/kpi-power-in-big-company</loc>
                    <lastmod>2026-11-06T01:00:00Z</lastmod>
                  </url>
                </urlset>
  /public/api/v1/me:
    get:
      summary: The signed-in user
      description: >
        Identifies who the session cookie belongs to, so the frontend can show the email. The email is the one of the
        verified Google ID token, never a value the client sent. Send the request with credentials (cookies).
      operationId: me
      tags:
        - Authentication
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
              example:
                email: owner@example.com
        '401':
          description: Not signed in. No session is created. The response body is not part of the contract.
  /public/api/v1/user:
    get:
      summary: Get the personalization of the signed-in user
      description: >
        Returns the signed-in user's row of tb_user_setting together with the email, for the personalization page.
        Until the user has saved anything there is no row, and the defaults of `UserSetting` are answered with
        `modifiedDate` null, which is how the frontend knows it is the user's first visit and sends them to this page. The MCP access
        key is part of the answer so it can be shown read only and copied; it cannot be changed here (see
        `/public/api/v1/user/access-token`). Send the request with credentials (cookies).
      operationId: userSetting
      tags:
        - Personalization
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The personalization of the signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSetting'
              example:
                email: owner@example.com
                nick: Dreaming for the Future
                mainTheme: Dreaming for the Future
                subTheme: 영원한 개발자를 향해
                aboutName: 나의 꿈
                aboutSlug: about
                workingName: 제가 일하는 곳은?
                workingSlug: my-working-places
                mcpAccessKey: eyJhbGciOiJIUzI1NiJ9.example
                modifiedDate: '2026-11-27T01:30:00Z'
        '401':
          description: Not signed in. The response body is not part of the contract.
    put:
      summary: Update the personalization of the signed-in user
      description: >
        Saves the nick name, the main and sub theme of the blog and the slugs the about and the working place links
        point to, in tb_user_setting for the signed-in user; the row is created by the first save. All five fields are
        sent every time and replace what was stored. The display texts of the two links (`aboutName`, `workingName`)
        and the MCP access key are not changed here: a field of the body that is not in `UserSettingInput` is ignored.
        The slugs are not checked against tb_post, so a slug may name a page that is written later. Answers the saved
        `UserSetting`.
      operationId: updateUserSetting
      tags:
        - Personalization
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingInput'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSetting'
        '400':
          description: A field is missing, longer than its limit, or a slug has a character other than English letters, digits and '-'. The response body is not part of the contract.
        '401':
          description: Not signed in. The response body is not part of the contract.
        '403':
          description: Signed in, but the request has no valid CSRF token (the X-XSRF-TOKEN header must equal the XSRF-TOKEN cookie). The response body is not part of the contract.
  /public/api/v1/user/access-token:
    put:
      summary: Renew the MCP access key
      description: >
        Revokes the signed-in user's MCP access key, so the old one stops working at once, and answers the renewed one.
        The server stores it (tb_user_setting.mcp_access_key); the caller has nothing to save. The row is created if the
        user has none yet, with the defaults of `UserSetting`. There is no request body.
      operationId: renewMcpAccessKey
      tags:
        - Personalization
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The renewed key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAccessKey'
              example:
                mcpAccessKey: eyJhbGciOiJIUzI1NiJ9.renewed
        '401':
          description: Not signed in. The response body is not part of the contract.
        '403':
          description: Signed in, but the request has no valid CSRF token (the X-XSRF-TOKEN header must equal the XSRF-TOKEN cookie). The response body is not part of the contract.
  /public/api/v1/pages:
    get:
      summary: List all published pages
      description: >
        Returns every published page (tb_post.type 'page', tb_post.status 'publish') for anonymous users or all pages belongs to sign-in user, ordered by id. The table keeps no
        parent or order, so parentId is always null and menuOrder always 0; the fields stay for compatibility.
        Page content is not included.
      operationId: listOfPages
      tags:
        - Pages
      responses:
        '200':
          description: Published pages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageList'
              example:
                pages:
                  - id: 2
                    title: 개발자의 꿈
                    slug: about
                    parentId: null
                    menuOrder: 0
                    publishedAt: '2016-03-14T02:36:24Z'
                    modifiedAt: '2024-03-01T23:57:29Z'
                  - id: 646
                    title: 글읽기( ~ 2019)
                    slug: reading-in-2019
                    parentId: null
                    menuOrder: 0
                    publishedAt: '2019-02-07T00:41:58Z'
                    modifiedAt: '2020-04-16T15:27:54Z'
  /public/api/v1/posts:
    get:
      summary: List published posts matching a search query
      description: >
        Returns published posts (tb_post.type 'post', tb_post.status 'publish') or all pages belongs to sign-in user that match the query,
        ordered by creation date newest first (tb_post.created_datetime descending, then id descending). Post content
        is not included. Without query, every published post matches, so the call also serves as the recent posts
        list (use limit). The client sends a search when the user presses Enter in the search input, and does not
        send it when the input is blank.
      operationId: listOfPosts
      tags:
        - Posts
      parameters:
        - name: queryType
          in: query
          required: false
          description: >
            How query is matched. keyword: case-insensitive substring match against tb_post.title or
            tb_post.content; a post matches if either contains the query. The content match runs on the
            stored content, so it can also hit block comments and markup.
            tag: reserved; the matching rule is not defined yet and the server responds with 501.
          schema:
            type: string
            enum:
              - keyword
              - tag
            default: keyword
        - name: query
          in: query
          required: false
          description: >
            The search text exactly as the user typed it in the search input. When absent, every published post
            matches. When present it must contain at least one non-whitespace character; an empty or
            whitespace-only query is rejected with 400.
          schema:
            type: string
            minLength: 1
            pattern: '\S'
          example: KPI
        - name: limit
          in: query
          required: false
          description: >
            The maximum number of posts to return, taken from the newest. When absent, every match is returned.
            A value outside 1 to 100, or not an integer, is rejected with 400.
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 10
      responses:
        '200':
          description: Matching published posts; an empty list when nothing matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostList'
              example:
                posts:
                  - id: 7061
                    title: 큰기업의 배움 - KPI, 조직을 움직이는 힘
                    slug: '%ed%81%b0%ea%b8%b0%ec%97%85%ec%9d%98-%eb%b0%b0%ec%9b%80-kpi'
                    date: '2026-11-05T09:45:11'
        '400':
          description: >
            query is present but empty or whitespace-only, queryType is not one of the allowed values, or limit is
            not an integer from 1 to 100. The response body is not part of the contract.
        '501':
          description: queryType is tag, which is not implemented yet. The response body is not part of the contract.
  /public/api/v1/post:
    post:
      summary: Create a post
      description: >
        Creates a post as a draft (tb_post.status 'draft') unless the body's status is 'publish', which creates it published.
        The author (tb_post.author_id) is the signed-in user's id in tb_user. The created post is returned with its stored values.
      operationId: createPost
      tags:
        - Posts
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostBody'
        '400':
          description: A required field is missing or blank, the title is longer than 130 characters, the slug is longer than 200 characters or has a character other than English letters, digits and '-', or the status is neither draft nor publish. The response body is not part of the contract.
        '401':
          description: Not authenticated. The response body is not part of the contract.
        '403':
          description: Signed in, but the request has no valid CSRF token (the X-XSRF-TOKEN header must equal the XSRF-TOKEN cookie). The response body is not part of the contract.
        '409':
          description: Another post already has this slug. The response body is not part of the contract.
        '500':
          description: Failed to create. The response body is not part of the contract.
  /public/api/v1/post/{slug}:
    put:
      summary: Update a post
      description: >
        Replaces title, slug and content of the post identified by the path slug. The status is changed only when the body
        has a status ('publish' publishes the post, 'draft' makes it a draft again); otherwise it stays as it is.
        If the body slug differs from the path slug, the post is renamed; the old slug no longer resolves, and the new slug
        must follow the slug rule of PostInput. A body slug equal to the path slug keeps the slug as it is, whatever
        characters it has, so rows migrated from WordPress can be updated.
        Only the author of the row (tb_post.author_id) can update it; every row is a post or a page.
      operationId: updatePost
      tags:
        - Posts
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The current slug of the post, encoded as in the GET operation of this path.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostBody'
        '400':
          description: A required field is missing or blank, the title is longer than 130 characters, the slug is longer than 200 characters or has a character other than English letters, digits and '-', or the status is neither draft nor publish. The response body is not part of the contract.
        '401':
          description: Not authenticated. The response body is not part of the contract.
        '403':
          description: Signed in, but the request has no valid CSRF token (the X-XSRF-TOKEN header must equal the XSRF-TOKEN cookie), or the post was written by another user. The response body is not part of the contract.
        '404':
          description: No row in tb_post has the path slug. The response body is not part of the contract.
        '409':
          description: Another post already has the body slug. The response body is not part of the contract.
        '500':
          description: Failed to update. The response body is not part of the contract.
    delete:
      summary: Delete a post
      description: >
        Deletes the post or page identified by the path slug: its tb_post row is removed for good, whatever its status, and
        the slug resolves no more. Only the author of the row (tb_post.author_id) can delete it. Media items it used are not touched.
      operationId: deletePost
      tags:
        - Posts
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The current slug of the post, encoded as in the GET operation of this path.
          schema:
            type: string
      responses:
        '204':
          description: Deleted. There is no response body.
        '401':
          description: Not authenticated. The response body is not part of the contract.
        '403':
          description: Signed in, but the request has no valid CSRF token (the X-XSRF-TOKEN header must equal the XSRF-TOKEN cookie), or the post was written by another user. The response body is not part of the contract.
        '404':
          description: No post or page has the path slug. The response body is not part of the contract.
        '500':
          description: Failed to delete. The response body is not part of the contract.
    get:
      summary: Read a body of a post or a page.
      description: >
        Returns the tb_post row whose slug matches, whatever its type or status. The slug is unique across all types. For unknown slugs, it responds with 404.
      operationId: postBody
      tags:
        - Posts
      parameters:
        - name: slug
          in: path
          required: true
          description: >
            The post's slug as readers see it, URL-encoded once like any path segment (e.g. 큰기업 is sent as
            %ED%81%B0...). tb_post.slug keeps non-ASCII slugs percent-encoded in lowercase, as WordPress stored them; the server converts to that form before matching, so clients never send the stored form.
          schema:
            type: string
          example: kpi-power-in-big-company
      responses:
        '200':
          description: The post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostBody'
              example:
                title: 큰기업의 배움 - KPI, 조직을 움직이는 힘
                slug: '%ed%81%b0%ea%b8%b0%ec%97%85%ec%9d%98-%eb%b0%b0%ec%9b%80-kpi'
                content: '<!-- wp:paragraph --><p>...</p><!-- /wp:paragraph -->'
                status: publish
                type: post
                date: '2026-11-05T09:45:11'
                modified: '2026-11-05T09:45:11'
                hashTags: 경영,KPI,조직
                canEdit: false
        '404':
          description: No row in tb_post has this slug. The response body is not part of the contract.
  /public/api/v1/medias:
    get:
      summary: List all media items
      description: >
        Returns every item of tb_media, images and YouTube videos alike, newest first (by date, then id). There is no
        paging: the list is for the editor's gallery, which is opened rarely. Only a signed-in user may list, because
        the list also names media of posts that are not published; the files themselves stay public.
      operationId: listOfMedias
      tags:
        - Media
      security:
        - sessionCookie: []
      responses:
        '200':
          description: All media items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaList'
              example:
                medias:
                  - slug: youtube-dQw4w9WgXcQ
                    provider: external
                    mimeType: https://youtu.be/dQw4w9WgXcQ
                    url: https://youtu.be/dQw4w9WgXcQ
                    thumbnail: https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg
                    date: '2026-11-18T02:10:00Z'
                  - slug: photo-3fa9c1d2
                    provider: internal
                    mimeType: image/png
                    url: /public/api/v1/media/photo-3fa9c1d2
                    thumbnail: null
                    date: '2026-11-18T01:30:00Z'
        '401':
          description: Not authenticated. The response body is not part of the contract.
  /public/api/v1/media:
    post:
      summary: Register a media item
      description: >
        Registers a media item in tb_media, owned (owner_id) by the signed-in user's id in tb_user, and returns it. With multipart/form-data the part `file` is an image stored
        on the server, provider internal unless the part `provider` says content; with application/json the body names a YouTube video, which is only
        registered by reference and never fetched or embedded (provider external). The image type is decided from the
        file content, not from the client's Content-Type or file name; only PNG, JPEG, GIF and WebP are accepted, up to
        10 MB. Registering the same YouTube video again returns the existing item with 200.

        An image without the part `slug` gets its slug from the file name (see `Media.slug`). With `slug` the image has
        exactly that slug, with nothing appended. When an image of the signed-in user already has it, nothing is
        changed and the answer is 409, unless `replace` is true: then the file of that item is replaced by the new one,
        keeping its slug and provider, and the item is answered with 200. A slug held by anything else, such as another
        user's image or a video, is 422 whatever `replace` says.
      operationId: createMedia
      tags:
        - Media
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaUpload'
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalMediaInput'
      responses:
        '200':
          description: The YouTube video was already registered, or the image with the given `slug` was replaced; the item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
              examples:
                image:
                  value:
                    slug: photo-3fa9c1d2
                    provider: internal
                    mimeType: image/png
                    url: /public/api/v1/media/photo-3fa9c1d2
                    thumbnail: null
                    date: '2026-11-18T01:30:00Z'
                youtube:
                  value:
                    slug: youtube-dQw4w9WgXcQ
                    provider: external
                    mimeType: https://youtu.be/dQw4w9WgXcQ
                    url: https://youtu.be/dQw4w9WgXcQ
                    thumbnail: https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg
                    date: '2026-11-18T01:30:00Z'
        '400':
          description: >
            The file is missing or empty, `provider` is neither internal nor content, `slug` is empty, longer than 100
            characters or has a character other than lower case English letters, digits and '-' (or starts or ends with
            '-'), or the url is not a YouTube video link. The response body is not part of the contract.
        '401':
          description: Not authenticated. The response body is not part of the contract.
        '403':
          description: Signed in, but the request has no valid CSRF token (the X-XSRF-TOKEN header must equal the XSRF-TOKEN cookie). The response body is not part of the contract.
        '409':
          description: An image of the signed-in user already has the given `slug` and `replace` is not true. The response body is not part of the contract.
        '413':
          description: The file is larger than 10 MB. The response body is not part of the contract.
        '415':
          description: The file is not a PNG, JPEG, GIF or WebP image. The response body is not part of the contract.
        '422':
          description: The given `slug` is held by an item the signed-in user cannot replace, such as another user's image or a video. The response body is not part of the contract.
  /public/api/v1/media/{slug}:
    get:
      summary: Get the file of an image
      description: >
        Returns the stored bytes of an internal or content media item with its mime type, for use as an image source. External
        items have no file here. The bytes are exactly the ones uploaded: nothing is re-encoded, resized or stripped, so
        data carried inside the file survives, such as the diagram in a PNG exported from draw.io with "Include a copy
        of my diagram", which the editor reads to reopen the diagram. An image the post save deleted as replaced (see
        `PostInput.replacedMedia`) answers 404. The answer carries an ETag and must be revalidated on every use
        (Cache-Control no-cache), so a replaced file shows at once while an unchanged one answers 304.
      operationId: getMediaFile
      tags:
        - Media
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: No internal or content media item has this slug. The response body is not part of the contract.
    put:
      summary: Rename the slug of an image
      description: >
        Gives the internal or content image identified by the path slug a new slug, so its file URL becomes
        `/public/api/v1/media/{new slug}`. The file and everything else stay. The old URL stops working, and posts and
        pages whose content refers to it are not changed, so they show a broken image until they use the new URL;
        the caller is expected to say so. Only the user who
        registered the item (tb_media.owner_id) can rename it. Asking for the slug it already has changes nothing and
        answers 200. A YouTube video cannot be renamed: its slug follows its video id.
      operationId: renameMedia
      tags:
        - Media
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaRename'
      responses:
        '200':
          description: The renamed item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          description: The new slug is missing, longer than 100 characters, or has a character other than lower case English letters, digits and '-' (or starts or ends with '-'). The response body is not part of the contract.
        '401':
          description: Not authenticated. The response body is not part of the contract.
        '403':
          description: Signed in, but the request has no valid CSRF token (the X-XSRF-TOKEN header must equal the XSRF-TOKEN cookie), or the item was registered by another user. The response body is not part of the contract.
        '404':
          description: No media item has the path slug. The response body is not part of the contract.
        '409':
          description: Another media item already has the new slug. The response body is not part of the contract.
        '422':
          description: The item is a YouTube video, which cannot be renamed. The response body is not part of the contract.
    delete:
      summary: Delete a media item
      description: >
        Deletes the media item identified by the path slug: its tb_media row is removed for good and, for an image, its
        file on the server too, whatever the provider. Only the user who registered the item (tb_media.owner_id) can
        delete it. A post or page whose content refers to the item is not changed and then shows a broken image or link,
        so the caller is expected to warn the writer first. A YouTube video has no file; only its row is removed.
      operationId: deleteMedia
      tags:
        - Media
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted. There is no response body.
        '401':
          description: Not authenticated. The response body is not part of the contract.
        '403':
          description: Signed in, but the request has no valid CSRF token (the X-XSRF-TOKEN header must equal the XSRF-TOKEN cookie), or the item was registered by another user. The response body is not part of the contract.
        '404':
          description: No media item has the path slug. The response body is not part of the contract.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  schemas:
    Identity:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          description: The email address of the signed-in Google account
    UserSetting:
      type: object
      required:
        - email
        - nick
        - mainTheme
        - subTheme
        - aboutName
        - aboutSlug
        - workingName
        - workingSlug
        - mcpAccessKey
        - modifiedDate
      properties:
        email:
          type: string
          description: tb_user.email of the signed-in user
        nick:
          type:
            - string
            - 'null'
          maxLength: 60
          description: tb_user_setting.nick, the user's nick name in the blog. null until the user sets one.
        mainTheme:
          type: string
          maxLength: 256
          description: tb_user_setting.main_theme, the main title of the blog shown in the header. Default `Dreaming for the Future`.
        subTheme:
          type: string
          maxLength: 256
          description: tb_user_setting.sub_theme, the sub title shown under it, linked to the about page. Default `영원한 개발자를 향해`.
        aboutName:
          type: string
          description: tb_user_setting.about_name, the text of the about link in the navigation. Default `나의 꿈`.
        aboutSlug:
          type: string
          description: tb_user_setting.about_slug, the slug of the post the about link opens (`/post/{aboutSlug}`). Default `about`.
        workingName:
          type: string
          description: tb_user_setting.working_name, the text of the working place link. Default `제가 일하는 곳은?`.
        workingSlug:
          type: string
          description: tb_user_setting.working_slug, the slug of the post the working place link opens. Default `my-working-places`.
        mcpAccessKey:
          type:
            - string
            - 'null'
          description: >
            tb_user_setting.mcp_access_key, the key MCP clients present. Read only here; null until one is issued with
            `/public/api/v1/user/access-token`.
        modifiedDate:
          type:
            - string
            - 'null'
          format: date-time
          description: tb_user_setting.modified_date in UTC, when the row was created or last changed. null while there is no row.
    UserSettingInput:
      type: object
      required:
        - nick
        - mainTheme
        - subTheme
        - aboutSlug
        - workingSlug
      properties:
        nick:
          type:
            - string
            - 'null'
          maxLength: 60
          description: tb_user_setting.nick; at most 60 characters. null or a blank text clears it (stored as null).
        mainTheme:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '\S'
          description: tb_user_setting.main_theme; must contain a non-whitespace character
        subTheme:
          type: string
          maxLength: 256
          description: tb_user_setting.sub_theme; may be empty, which hides the sub title
        aboutSlug:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z0-9-]+$'
          description: tb_user_setting.about_slug; the slug rule of `PostInput.slug`
        workingSlug:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z0-9-]+$'
          description: tb_user_setting.working_slug; the slug rule of `PostInput.slug`
    McpAccessKey:
      type: object
      required:
        - mcpAccessKey
      properties:
        mcpAccessKey:
          type: string
          description: The renewed tb_user_setting.mcp_access_key
    MediaList:
      type: object
      required:
        - medias
      properties:
        medias:
          type: array
          items:
            $ref: '#/components/schemas/Media'
    MediaUpload:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: The image file
        provider:
          type: string
          enum: [internal, content]
          default: internal
          description: >
            Optional. internal, the default, is an image of the media library, kept until removed by hand. content is an
            image made for the content of one post, such as a draw.io diagram drawn in the editor: a post save may delete it
            once nothing shows it any more (see `PostInput.replacedMedia`). Ignored when an existing image is replaced.
        slug:
          type: string
          maxLength: 100
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: >
            Optional. The exact slug of the image, with no suffix appended. Without it the slug is made of the file name
            plus a random suffix.
        replace:
          type: boolean
          default: false
          description: >
            Optional, used with `slug`. true replaces the file of the signed-in user's image that already has the slug;
            false refuses with 409. Nothing is replaced when no image has the slug: it is created.
    MediaRename:
      type: object
      required:
        - slug
      properties:
        slug:
          type: string
          maxLength: 100
          description: The new tb_media.slug, by the rule of `MediaUpload.slug`.
    ExternalMediaInput:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          maxLength: 2048
          description: >
            A YouTube video link: https://www.youtube.com/watch?v=ID, https://youtu.be/ID,
            https://www.youtube.com/shorts/ID or https://www.youtube.com/embed/ID (also m.youtube.com), where ID is 11
            characters of English letters, digits, '-' and '_'. Anything else is rejected with 400.
    Media:
      type: object
      required:
        - slug
        - provider
        - mimeType
        - url
        - thumbnail
        - date
      properties:
        slug:
          type: string
          description: >
            tb_media.slug, unique. An image gets the `MediaUpload.slug` it was uploaded with, or else its file name reduced
            to English letters, digits and '-' plus a random suffix; a YouTube video gets youtube- plus its video ID.
        provider:
          type: string
          enum: [internal, external, content]
          description: >
            tb_media.provider. internal is a file on the server, external a reference such as a YouTube URL, content a
            file on the server made for the content of a post, such as a draw.io diagram, which a post save may delete
            once nothing shows it (see `MediaUpload.provider`).
        mimeType:
          type: string
          description: tb_media.mime_type. The image's mime type for internal and content, otherwise the URL.
        url:
          type: string
          description: >
            Where to load the item. For internal and content a server-relative path (/public/api/v1/media/{slug}) to be resolved
            against the backend; for external the canonical https://youtu.be/ID link.
        thumbnail:
          type:
            - string
            - 'null'
          description: tb_media.thumbnail. The YouTube thumbnail image URL for a YouTube video, null for an image.
        date:
          type: string
          format: date-time
          description: tb_media.date, when it was registered, in UTC (for example 2026-11-18T01:30:00Z)
    PostInput:
      type: object
      required:
        - title
        - slug
        - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 130
          pattern: '\S'
          description: tb_post.title; must contain a non-whitespace character, at most 130 characters
        slug:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z0-9-]+$'
          description: |
            User friendly and unique URL, stored at tb_post.slug. Only English letters (A-Z, a-z), digits (0-9) and '-'
            are allowed: no space, underscore, non-ASCII or other character. Anything else is rejected with 400, except that an
            update may send the slug the row already has (the path slug of PUT) as it is, whatever it contains.
        content:
          type: string
          description: tb_post.content
        status:
          type: string
          enum:
            - draft
            - publish
          description: >
            Optional. publish makes the post public, draft keeps it to its author. Left out, a created post is a
            draft and an updated post keeps its status. Any other value is rejected with 400.
        hashTags:
          type: string
          maxLength: 200
          description: >
            Optional. tb_post.hash_tags: the hash tags separated by commas, without the `#` prefix (e.g. `경영,KPI`),
            stored as sent, at most 200 characters in all (the column is VARCHAR(200)); a longer text is rejected with 400. An empty string removes every tag. Left out, a created post has none and an updated post
            keeps its tags.
          examples:
            - 경영,KPI
        replacedMedia:
          type: array
          maxItems: 100
          items:
            type: string
          description: >
            Optional. Slugs of images the writer replaced while editing, such as a draw.io diagram saved again from the
            editor, together with the versions uploaded along the way. Once the post is saved, each of them that is a
            content image (provider content) uploaded by the writer and that the content of no post or page, of any status,
            refers to by its file URL (`/public/api/v1/media/{slug}`) is deleted, row and file, for good. Any other slug,
            unknown, an internal image of the library, a video, someone else's or still in use, is left as it is. If the
            save is refused, nothing is deleted. More than 100 slugs are rejected with 400. Left out or empty, nothing is
            deleted.
    PostList:
      type: object
      required:
        - posts
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/PostSummary'
    PostSummary:
      type: object
      required:
        - id
        - title
        - slug
        - status
        - date
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: tb_post.title
        slug:
          type: string
          description: >
            tb_post.slug as stored. Non-ASCII slugs are lowercase percent-encoded, so decode once
            to get the slug readers see before building /post/{slug} or calling /public/api/v1/post/{slug}.
        status:
          type: string
          enum:
            - draft
            - publish
            - private
          description: >
            tb_post.status. Anyone gets publish; draft and private rows come back only to their author
            (see the description of the operation).
          examples:
            - publish
        date:
          type: string
          description: tb_post.created_datetime in the same local format as PostBody.date
          examples:
            - '2026-11-05T09:45:11'
    PostBody:
      type: object
      required:
        - title
        - slug
        - content
        - status
        - type
        - date
        - modified
        - hashTags
        - canEdit
      properties:
        title:
          type: string
          description: tb_post.title
        slug:
          type: string
          description: User friendly and unique URL, stored at tb_post.slug
        content:
          type: string
          description: >
            tb_post.content as stored. Rows migrated from WordPress still hold its HTML, block comments and shortcodes.
            It is not rendered HTML.
        status:
          type: string
          enum:
            - draft
            - publish
            - private
          description: tb_post.status; rows of any status are returned
          examples:
            - publish
        type:
          type: string
          enum:
            - post
            - page
          description: tb_post.type; readers open a page at /page/{slug} and a post at /post/{slug}
          examples:
            - post
        date:
          type: string
          description: >
            tb_post.created_datetime (UTC), shown in the site's local time zone (Asia/Seoul),
            formatted as yyyy-MM-ddTHH:mm:ss with no offset
          examples:
            - '2026-11-05T09:45:11'
        modified:
          type: string
          description: tb_post.modified_datetime (UTC), shown in the same local format as date
          examples:
            - '2026-11-05T09:45:11'
        hashTags:
          type: string
          description: >
            tb_post.hash_tags as stored: the hash tags separated by commas, without the `#` prefix (e.g. `경영,KPI,조직`).
            An empty string when the row has none. The client splits it at commas, trims each tag and skips empty ones.
          examples:
            - 경영,KPI,조직
        canEdit:
          type: boolean
          description: >
            Whether the requester is the author of this row (tb_post.author_id): true only for a signed-in user who wrote
            it, whatever its type. It is false for an anonymous visitor, for another user's row and for a row with no
            author. A post or a page can be updated and deleted by its author.
          examples:
            - false
    PageList:
      type: object
      required:
        - pages
      properties:
        pages:
          type: array
          items:
            $ref: '#/components/schemas/PageSummary'
    PageSummary:
      type: object
      required:
        - id
        - title
        - slug
        - parentId
        - menuOrder
        - publishedAt
        - modifiedAt
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        slug:
          type: string
          description: URL-friendly page name
        parentId:
          type:
            - integer
            - 'null'
          format: int64
          description: 'Always null: tb_post has no parent'
        menuOrder:
          type: integer
          description: 'Always 0: tb_post has no menu order'
        publishedAt:
          type: string
          format: date-time
          description: Publish time in UTC
        modifiedAt:
          type: string
          format: date-time
          description: Last modified time in UTC
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          examples:
            - UP
