openapi: 3.1.0
info:
  title: simple-blog MCP API (draft for review)
  version: 0.1.0
  description: >
    The Model Context Protocol (MCP) server of the blog, so an AI client can read the blog's posts. Draft for review. It
    follows the URL class `/mcp/v{N}/{URI}` of CLAUDE.md and the MCP Streamable HTTP transport, in its simplest form:
    one endpoint that answers every JSON-RPC 2.0 message with a plain JSON response, with no session and no server
    sent event stream. The first version has five tools over tb_post: three that read posts and two that write them.
    Deleting, and tools for the bookshelf and the media, are left for later versions.


    Who is calling. A client holds the MCP access key of a user (tb_user_setting.mcp_access_key, shown on the
    personalization page and renewed by `PUT /public/api/v1/user/access-token` of apispec.yaml) and sends it as a bearer
    token. Every call acts as that user: it sees the published posts and the user's own drafts, and the posts it writes
    are the user's, exactly as when the user is signed in. The key is not a session: there is no cookie and so no CSRF token. Renewing the key makes the
    old one fail with 401 at once.


    The protocol version is 2025-06-18. The server does not stream, ignores `Mcp-Session-Id` and never issues one, and
    does not support JSON-RPC batches (a batch is rejected with 400).
servers:
  - url: http://localhost:8080
    description: Local
paths:
  /mcp/v1:
    post:
      summary: Send one JSON-RPC message to the MCP server
      description: >
        The only endpoint. The body is one JSON-RPC 2.0 request or notification. The methods are:


        - `initialize`: the handshake. The server answers the protocol version it speaks (2025-06-18, also when the client
        asked for another one), its capabilities (`tools` only, with `listChanged` false) and `serverInfo`.

        - `notifications/initialized`: the client's notification that the handshake is done. A notification has no `id`
        and is answered 202 with no body, like any other notification.

        - `ping`: answers an empty result, so a client can check that the key and the server work.

        - `tools/list`: lists the tools below, each with its `inputSchema`. No paging: the list is short.

        - `tools/call`: runs the tool named in `params.name` with `params.arguments`.


        Any other method is answered with the JSON-RPC error -32601.


        Tools (a post is visible when it is published or when the key's user wrote it):


        - `list_posts` (arguments `ListPostsArguments`): the newest posts, as `GET /public/api/v1/posts` without a query.

        - `search_posts` (`SearchPostsArguments`): the posts whose title or content contains the query, case-insensitive, newest
        first, as `GET /public/api/v1/posts` with queryType keyword.

        - `read_post` (`ReadPostArguments`): one post or page by its slug with its content, as `GET /public/api/v1/post/{slug}`.

        - `create_post` (`CreatePostArguments`): writes a new post, as `POST /public/api/v1/post`. It is always a draft.

        - `update_post` (`UpdatePostArguments`): changes a draft the key's user wrote, as `PUT /public/api/v1/post/{slug}`;
        only the arguments that are given change, the others keep their value. The post stays a draft.


        MCP works in drafts only: it cannot publish, unpublish or edit a published post. Publishing is done by the user in
        the editor. A post that is published, a page, and anyone else's post are refused by `update_post`.


        The two writing tools follow the rules of `PostInput` in apispec.yaml: the slug has only English letters, digits
        and '-' (up to 200 characters), the title is up to 130 characters, the hash tags up to 200, the slug is unique
        among all posts and pages, and a saved post is cached and fed like one written in the editor. `content` is Markdown;
        an image is written as a link to its file URL, and there is no tool that uploads one. Both tools answer the saved
        post as `PostContent`. A tool lists `annotations.readOnlyHint` in `tools/list`: true for the three that read.


        A tool answers a `ToolResult`: `structuredContent` holds the data, and `content` holds the same data as one JSON
        text, for clients that only read text. A tool that fails because of a value or a rule, so the client can act on
        it, answers a normal result with `isError` true and the reason as text: a slug no post has, a slug that is
        already taken or has a forbidden character, a text over its limit, a post the key's user did not write, or a post
        that is not a draft. A call
        that is not shaped right, such as an unknown tool, a missing required argument or an argument of the wrong type,
        is a JSON-RPC error (-32602).


        The answer to a request is always 200 with a JSON-RPC response, even when it carries a JSON-RPC error; the HTTP
        status tells only about the transport and the key.
      operationId: mcpMessage
      tags:
        - MCP
      security:
        - mcpAccessKey: []
      parameters:
        - name: Origin
          in: header
          required: false
          description: >
            A browser sends it; a client written for MCP usually does not. When it is present it must be one of the
            origins the server allows (simpleblog.cors.allowed-origin-patterns), or the call is refused with 403, as
            the transport specification asks, so a web page cannot use the key a user has typed into it.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              initialize:
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: '2025-06-18'
                    capabilities: {}
                    clientInfo:
                      name: example-client
                      version: 1.0.0
              initialized:
                value:
                  jsonrpc: '2.0'
                  method: notifications/initialized
              toolsList:
                value:
                  jsonrpc: '2.0'
                  id: 2
                  method: tools/list
              searchPosts:
                value:
                  jsonrpc: '2.0'
                  id: 3
                  method: tools/call
                  params:
                    name: search_posts
                    arguments:
                      query: KPI
                      limit: 5
              readPost:
                value:
                  jsonrpc: '2.0'
                  id: 4
                  method: tools/call
                  params:
                    name: read_post
                    arguments:
                      slug: my-first-post
              createPost:
                value:
                  jsonrpc: '2.0'
                  id: 6
                  method: tools/call
                  params:
                    name: create_post
                    arguments:
                      title: A note from MCP
                      slug: a-note-from-mcp
                      content: |
                        The first paragraph, in Markdown.
                      hashTags: mcp,notes
              updatePost:
                value:
                  jsonrpc: '2.0'
                  id: 7
                  method: tools/call
                  params:
                    name: update_post
                    arguments:
                      slug: a-note-from-mcp
                      content: A rewritten text.
      responses:
        '200':
          description: >
            The JSON-RPC response to a request: a `result`, or an `error` for a failure of the call itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
              examples:
                initialize:
                  value:
                    jsonrpc: '2.0'
                    id: 1
                    result:
                      protocolVersion: '2025-06-18'
                      capabilities:
                        tools:
                          listChanged: false
                      serverInfo:
                        name: simple-blog
                        version: 0.1.0
                toolsList:
                  value:
                    jsonrpc: '2.0'
                    id: 2
                    result:
                      tools:
                        - name: list_posts
                          description: Lists the newest posts, newest first.
                          inputSchema:
                            type: object
                            properties:
                              limit:
                                type: integer
                                minimum: 1
                                maximum: 50
                                default: 10
                searchPosts:
                  value:
                    jsonrpc: '2.0'
                    id: 3
                    result:
                      isError: false
                      structuredContent:
                        posts:
                          - slug: kpi-and-organizations
                            title: KPI, the force that moves an organization
                            status: publish
                            date: '2026-11-05T09:45:11'
                      content:
                        - type: text
                          text: '{"posts":[{"slug":"kpi-and-organizations","title":"KPI, the force that moves an organization","status":"publish","date":"2026-11-05T09:45:11"}]}'
                slugTaken:
                  value:
                    jsonrpc: '2.0'
                    id: 6
                    result:
                      isError: true
                      content:
                        - type: text
                          text: 'A post or page already has the slug: a-note-from-mcp'
                postNotFound:
                  value:
                    jsonrpc: '2.0'
                    id: 4
                    result:
                      isError: true
                      content:
                        - type: text
                          text: 'No post or page has the slug: my-first-post'
                unknownMethod:
                  value:
                    jsonrpc: '2.0'
                    id: 5
                    error:
                      code: -32601
                      message: Method not found
        '202':
          description: A notification was accepted. There is no response body.
        '400':
          description: >
            The body is not a single JSON-RPC message: it is not valid JSON, it is a batch (an array), or it has no
            `jsonrpc` of "2.0" or no `method`. The body is a JSON-RPC response with the error -32700 (parse error) or
            -32600 (invalid request) and `id` null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
        '401':
          description: >
            The `Authorization` header is missing or the key is not a user's current key (never issued, or replaced by a
            renewal). The answer carries `WWW-Authenticate: Bearer`. The response body is not part of the contract.
          headers:
            WWW-Authenticate:
              schema:
                type: string
        '403':
          description: The request has an `Origin` that is not allowed. The response body is not part of the contract.
        '415':
          description: The body is not application/json. The response body is not part of the contract.
    get:
      summary: Not supported
      description: >
        The server sends no messages on its own, so there is no event stream to open. Answers 405 with
        `Allow: POST`, which a client takes as "no stream here". `DELETE`, which would end a session, is answered 405
        too: there are no sessions.
      operationId: mcpStream
      tags:
        - MCP
      security:
        - mcpAccessKey: []
      responses:
        '405':
          description: Method not allowed
          headers:
            Allow:
              schema:
                type: string
                const: POST
        '401':
          description: The key is missing or not current. The response body is not part of the contract.
components:
  securitySchemes:
    mcpAccessKey:
      type: http
      scheme: bearer
      description: >
        The user's MCP access key (tb_user_setting.mcp_access_key), sent as `Authorization: Bearer {key}`. Issued and
        renewed on the personalization page.
  schemas:
    JsonRpcRequest:
      type: object
      required:
        - jsonrpc
        - method
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          type:
            - string
            - integer
          description: The request id the answer repeats. Left out for a notification, which is not answered.
        method:
          type: string
          description: One of initialize, notifications/initialized, ping, tools/list and tools/call.
        params:
          type: object
          description: The parameters of the method; for tools/call, `name` and `arguments`.
    JsonRpcResponse:
      type: object
      required:
        - jsonrpc
        - id
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          type:
            - string
            - integer
            - 'null'
          description: The id of the request; null when the request could not be read.
        result:
          type: object
          description: The result of the method; a `ToolResult` for tools/call. Present unless there is an `error`.
        error:
          $ref: '#/components/schemas/JsonRpcError'
    JsonRpcError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: >
            -32700 parse error, -32600 invalid request, -32601 method not found, -32602 invalid params (also an unknown
            tool), -32603 internal error.
        message:
          type: string
    ToolResult:
      type: object
      required:
        - content
        - isError
      properties:
        isError:
          type: boolean
          description: true when the tool could not do what was asked and `content` says why.
        structuredContent:
          type: object
          description: The data of the tool, as `PostSummaries` (the lists) or `PostContent` (read, create and update). Absent when `isError` is true.
        content:
          type: array
          description: The same data as one JSON text, or the reason of the failure.
          items:
            type: object
            required:
              - type
              - text
            properties:
              type:
                type: string
                const: text
              text:
                type: string
    ListPostsArguments:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          description: How many of the newest posts to list.
    SearchPostsArguments:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          pattern: '\S'
          description: The text to look for in the title and the content of the posts; it must contain a non-whitespace character.
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          description: How many of the newest matches to list.
    ReadPostArguments:
      type: object
      required:
        - slug
      properties:
        slug:
          type: string
          description: The slug of the post or page, as `list_posts` and `search_posts` give it.
    CreatePostArguments:
      type: object
      required:
        - title
        - slug
        - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 130
          pattern: '\S'
          description: The title; it must contain a non-whitespace character.
        slug:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z0-9-]+$'
          description: The unique URL name; English letters, digits and '-' only.
        content:
          type: string
          description: The Markdown of the post.
        hashTags:
          type: string
          maxLength: 200
          description: The hash tags separated by commas, without `#`. Left out, the post has none.
    UpdatePostArguments:
      type: object
      required:
        - slug
      properties:
        slug:
          type: string
          description: The current slug of the post, as `list_posts` gives it. It must be a draft the key's user wrote.
        newSlug:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z0-9-]+$'
          description: A new slug for the post, by the same rule as `CreatePostArguments.slug`. Left out, the slug stays.
        title:
          type: string
          minLength: 1
          maxLength: 130
          pattern: '\S'
          description: A new title. Left out, it stays.
        content:
          type: string
          description: The new Markdown of the whole post, which replaces the old one. Left out, it stays.
        hashTags:
          type: string
          maxLength: 200
          description: The new hash tags; an empty text removes them. Left out, they stay.
    PostSummaries:
      type: object
      required:
        - posts
      properties:
        posts:
          type: array
          items:
            type: object
            required:
              - slug
              - title
              - status
              - date
            properties:
              slug:
                type: string
              title:
                type: string
              status:
                type: string
                enum:
                  - draft
                  - publish
                  - private
                description: draft and private rows are only listed to the user who wrote them.
              date:
                type: string
                description: tb_post.created_datetime in the site's local time zone (Asia/Seoul), as yyyy-MM-ddTHH:mm:ss without an offset.
    PostContent:
      type: object
      required:
        - slug
        - title
        - content
        - status
        - type
        - date
        - modified
        - hashTags
      properties:
        slug:
          type: string
        title:
          type: string
        content:
          type: string
          description: The Markdown of the post as stored. A row migrated from WordPress still holds its HTML.
        status:
          type: string
          enum:
            - draft
            - publish
            - private
        type:
          type: string
          enum:
            - post
            - page
        date:
          type: string
          description: Created, in the site's local time zone, like `PostSummaries`.
        modified:
          type: string
          description: Last modified, in the same form.
        hashTags:
          type: string
          description: The hash tags separated by commas, without `#`; empty when there are none.
