spring.application.name=simple-blog

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chidoo_blog}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.pool-name=simple-blog-pool
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.open-in-view=false

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Never create or alter tables: the schema belongs to WordPress (and db/TB_MEDIA.sql for TB_MEDIA).
spring.jpa.hibernate.ddl-auto=none
# Use the names in @Table and @Column exactly: TB_MEDIA is upper case, and MySQL on Linux is case sensitive about tables.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Creating and updating posts needs a signed-in Google session (and the CSRF token); see SecurityConfig.
# wp_posts.post_author of created posts (WordPress user ID).
simpleblog.write.author-id=1

# Longest title (in characters) and slug (post_name is varchar(200)) a post may have; longer ones are refused with 400.
# be/apispec.yaml states the same limits as maxLength.
simpleblog.post.title.max-length=130
simpleblog.post.slug.max-length=200

# Google sign-in is configured only where simpleblog.auth.google.client-id and client-secret are set: in the gitignored
# config/application-local.properties or the deployment's environment, never in this tracked file.
# Where the browser returns after signing in: the frontend's address. Empty means the same origin as the backend.
simpleblog.auth.frontend-url=

# The emails allowed to sign in with Google, comma separated and case-insensitive. Any other Google account is turned
# away with login=unauthorized. Empty means nobody can sign in.
simpleblog.auth.allowed-emails=doohyunchi@gmail.com

# Uploaded images are kept as files in this directory (created on the first upload); tb_media holds only their names.
simpleblog.media.directory=${MEDIA_DIR:./media}
# Largest accepted image; a bigger one is refused with 413. be/apispec.yaml states the same limit.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
