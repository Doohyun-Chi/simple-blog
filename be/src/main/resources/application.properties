spring.application.name=simple-blog

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chidoo_blog}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.pool-name=simple-blog-pool
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.open-in-view=false

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Never create or alter tables: the schema belongs to WordPress.
spring.jpa.hibernate.ddl-auto=none

# The write guard (bearer token on creating and updating posts) is OFF: until OAuth validation replaces it, the
# write endpoints accept every caller. Set to true to require Authorization: Bearer <simpleblog.write.token>.
simpleblog.write.access.enabled=false
# With the guard on and no token configured every write is refused with 403.
simpleblog.write.token=${WRITE_TOKEN:}
# wp_posts.post_author of created posts (WordPress user ID).
simpleblog.write.author-id=1

# Longest title (in characters) and slug (post_name is varchar(200)) a post may have; longer ones are refused with 400.
# be/apispec.yaml states the same limits as maxLength.
simpleblog.post.title.max-length=130
simpleblog.post.slug.max-length=200

# Google sign-in is configured only where simpleblog.auth.google.client-id and client-secret are set: in the gitignored
# config/application-local.properties or the deployment's environment, never in this tracked file.
# Where the browser returns after signing in: the frontend's address. Empty means the same origin as the backend.
simpleblog.auth.frontend-url=
