# Loaded with --spring.profiles.active=prod. Production serves the frontend at https://www.chidoo.me and this backend at
# https://blog.chidoo.me: two hosts of one site (chidoo.me), so the session cookie still goes along with the frontend's calls.

# The frontend calls the API from its own origin, with the session cookie.
simpleblog.cors.allowed-origin-patterns=https://www.chidoo.me
# Where the browser returns after signing in with Google.
simpleblog.auth.frontend-url=https://www.chidoo.me
# The XSRF-TOKEN cookie is set by blog.chidoo.me; for the frontend on www.chidoo.me to read it, it is set for the parent domain.
simpleblog.csrf.cookie-domain=chidoo.me

# Google sign-in: the OAuth client "Web application" of project simple-blog-mk1. The client ID is public (it is in the sign-in URL).
# The client secret is NOT here: set it in the deployment's environment as SIMPLEBLOG_AUTH_GOOGLE_CLIENT_SECRET.
simpleblog.auth.google.client-id=350677962130-5ttgd92u8v5jg6ke64tvfpg44h0gppvs.apps.googleusercontent.com

# The session cookie is for https only, and not sent along with requests from other sites. The redirect URI to register
# with Google is https://blog.chidoo.me/public/auth/google/callback.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
# Behind the reverse proxy the backend sees http; trust X-Forwarded-* so the redirect URI Spring builds for Google is https.
server.forward-headers-strategy=framework
