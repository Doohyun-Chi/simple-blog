# Overrides only the keys below on top of src/main/resources/application.properties.
spring.datasource.url=jdbc:h2:mem:simple_blog;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# H2 starts empty, so let Hibernate create the mapped tables for each test run.
spring.jpa.hibernate.ddl-auto=create-drop
