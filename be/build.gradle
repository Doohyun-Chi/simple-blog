plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.simpleblog'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacoco {
	toolVersion = '0.8.14'
}

// Coverage is measured only when asked for (./gradlew coverage), so test, build and bootRun stay uninstrumented.
def coverageTasks = ['coverage', 'jacocoTestReport']
def coverageRequested = gradle.startParameter.taskNames.any { name -> coverageTasks.any { name == it || name.endsWith(":${it}") } }

tasks.named('test') {
	useJUnitPlatform()
	jacoco {
		enabled = coverageRequested
	}
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	onlyIf { coverageRequested }
	reports {
		html.required = true
		xml.required = true
		csv.required = false
	}
}

tasks.register('coverage') {
	group = 'verification'
	description = 'Runs the tests with JaCoCo and writes the coverage report to build/reports/jacoco/test.'
	dependsOn tasks.named('jacocoTestReport')
}
