name: deploy-be
on:
  push:
    branches: [main]
    paths:
      - 'be/**'
      - '.github/workflows/deploy-be.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-be
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25
          cache: gradle

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon
          JAR=$(find build/libs -name '*.jar' ! -name '*-plain.jar' | head -1)
          test -n "$JAR" || { echo "boot jar not found" >&2; exit 1; }
          cp "$JAR" app.jar

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Upload jar
        run: aws s3 cp app.jar "s3://simple-blog-deploy/be/${GITHUB_SHA}/app.jar"

      - name: Deploy via SSM
        run: |
          IID="${{ vars.EC2_INSTANCE_ID }}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$IID" \
            --document-name AWS-RunShellScript \
            --comment "deploy be ${GITHUB_SHA::7}" \
            --parameters "commands=[\"/opt/deploy/deploy-be.sh ${GITHUB_SHA}\"]" \
            --timeout-seconds 600 \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$IID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" \
            --query Status --output text)
          [ "$STATUS" = "Success" ]
