# ── ALB 뒤에서 실제 클라이언트 IP 복원 ──
set_real_ip_from  172.31.0.0/16;      # 본인 VPC CIDR로 변경
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

upstream blog_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── 기본 서버: ALB 헬스체크 + 알 수 없는 Host 차단 ──
# ALB 헬스체크는 Host 헤더에 인스턴스 IP를 넣어 보내므로 여기서 응답해야 함
server {
    listen 80 default_server;
    server_name _;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name chidoo.me;

    return 301 https://www.chidoo.me$request_uri;
}

# ── www.chidoo.me: CSR 웹앱 ──
server {
    listen 80;
    server_name www.chidoo.me;

    root  /var/www/chidoo/current;     # Vite는 dist, CRA는 build
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # 해시가 붙은 빌드 산출물은 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html은 항상 새로 받도록
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Legacy(wordpress) RSS Feeding 처리: /index.php/feed 와 /index.php/feed/ 모두 매칭
    location ~ ^/index\.php/feed/?$ {
        return 301 https://blog.chidoo.me/public/feed;
    }

    # sitemap.xml은 정적 파일이 아니라 백엔드가 만든다. 이 location이 없으면 아래 SPA fallback이 index.html(HTML)을 돌려준다.
    # URI가 지정된 proxy_pass이므로 요청 경로 /sitemap.xml 대신 /public/sitemap.xml이 전달된다.
    location = /sitemap.xml {
        proxy_pass http://blog_api/public/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              blog.chidoo.me;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port  $http_x_forwarded_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # SPA 라우팅: 없는 경로는 index.html로 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── blog.chidoo.me: Spring Boot reverse proxy ──
server {
    listen 80;
    server_name blog.chidoo.me;

    client_max_body_size 20m;

    location / {
        proxy_pass http://blog_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;  # ALB가 넣어준 https
        proxy_set_header X-Forwarded-Port  $http_x_forwarded_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;   # ALB idle timeout(기본 60초)과 맞춤
    }
}
